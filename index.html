<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>第一段考後複習工作紙</title>
  <meta name="description" content="依第一學段考試卷整理的六張複習工作紙（每張 2 頁），逐題附提示與詳解" />
  <link rel="stylesheet" href="style.css?v=1794213099" />
  <link rel="stylesheet" href="projection.css?v=1794213099" />
  <!-- [本機修改] MathJax 3.2.2 本地檔（tex-svg-full），相對路徑，不使用 CDN；右鍵選單關閉 -->
  <script>
    window.MathJax = {
      loader: { paths: { mathjax: 'mathjax/es5' } },
      tex: { inlineMath: [['\\(', '\\)']], displayMath: [['$$', '$$']] },
      svg: { fontCache: 'global' },
      options: { enableMenu: false },
      startup: { typeset: false }
    };
  </script>
  <script src="mathjax/es5/tex-svg-full.js" id="MathJax-script"></script>
<style id="solScroll">.ex-sol{overflow-x:auto;max-width:100%}.ex-sol ol{margin:0!important;padding-left:60px!important}.ex-ans{overflow-x:auto}.kbox mjx-container{display:inline-block!important;margin:5px 0}.slide-info mjx-container,.slide-visual mjx-container{max-width:100%}.slide-info mjx-container>svg,.slide-visual mjx-container>svg{max-width:100%;height:auto}@media(max-height:800px){.kbox>div{margin:1px 0!important}.kbox mjx-container{margin:1px 0}}</style></head>
<body>
  <!-- 封面 -->
  <section id="cover" class="cover">
    <div class="cover-inner">
      <p class="cover-eyebrow">高三理數學</p>
      <h1 class="cover-title">第一段考後複習工作紙</h1>
      <p class="cover-sub">導數 · 求導法則 · 切線 · 導數應用 · 積分計算 · 面積</p>
      <div class="cover-chapters" id="coverChapters"></div>
      <button class="cover-start" id="startBtn">開始複習 →</button><a id="handoutLink" href="downloads/段考後複習工作紙_學生版.docx" download style="display:block;margin-top:14px;font-weight:700;color:#2563eb">下載工作紙（學生版 Word）</a><a href="downloads/網頁版補充公式.docx" download style="display:block;margin-top:8px;color:#2563eb">下載網頁補充公式（Word 方程式）</a>
      <p class="cover-hint">用 ← → 鍵翻頁，或點左側目錄跳章。空白鍵下一頁。</p>
    </div>
  </section>

  <!-- 主體 -->
  <div id="app" class="app hidden">
    <!-- 頂部列 -->
    <header class="topbar">
      <button class="home-btn" id="homeBtn" title="回封面">✦ 段考後複習</button>
      <div class="crumb" id="crumb"></div>
      <div class="top-actions">
        <button class="ghost-btn" id="tocToggle" title="目錄">☰ 目錄</button>
      </div>
    </header>

    <div class="body">
      <!-- 目錄側欄 -->
      <aside class="toc" id="toc"></aside>

      <!-- 舞台 -->
      <main class="stage">
        <div class="slide" id="slide"></div>

        <!-- 底部控制列 -->
        <div class="controlbar">
          <button class="nav-btn" id="prevBtn">‹ 上一頁</button>
          <div class="progress">
            <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
            <span class="progress-text" id="progressText">1 / 1</span>
          </div>
          <button class="nav-btn" id="nextBtn">下一頁 ›</button>
        </div>
      </main>
    </div>

    <!-- 授課教具：畫筆畫布、雷射點、浮動工具列 -->
    <canvas id="penCanvas" class="pen-canvas"></canvas>
    <div id="laserDot" class="laser-dot hidden"></div>
    <div id="dock" class="dock" role="toolbar" aria-label="授課教具">
      <!-- [本機新增] 收合／展開教具列（鍵盤 T） -->
      <button class="dbtn dk-toggle" id="dkToggle" title="收合教具列 (T)" aria-label="收合教具列" aria-expanded="true" aria-controls="dock">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg>
      </button>
      <button class="dbtn" id="dkSidebar" title="收合／展開側欄">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="9" y1="4" x2="9" y2="20"/></svg>
      </button>
      <button class="dbtn" id="dkPrev" title="上一頁 (←)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 5 8 12 15 19"/></svg>
      </button>
      <button class="dbtn" id="dkNext" title="下一頁 (→)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 5 16 12 9 19"/></svg>
      </button>
      <div class="dsep"></div>
      <button class="dbtn" id="dkLaser" title="雷射筆">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5" fill="currentColor" stroke="none"/></svg>
      </button>
      <button class="dbtn" id="dkPen" title="畫筆">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      </button>
      <div class="dcolors hidden" id="dkColors">
        <button class="dcolor active" data-c="#e11d48" style="--sc:#e11d48" title="紅"></button>
        <button class="dcolor" data-c="#2563eb" style="--sc:#2563eb" title="藍"></button>
        <button class="dcolor" data-c="#059669" style="--sc:#059669" title="綠"></button>
        <button class="dcolor" data-c="#f59e0b" style="--sc:#f59e0b" title="黃"></button>
        <button class="dcolor" data-c="#111827" style="--sc:#111827" title="黑"></button>
        <button class="dbtn derase" id="dkErase" title="橡皮擦">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15l7-7 6 6-4 4H8z"/><line x1="4" y1="21" x2="20" y2="21"/></svg>
        </button>
      </div>
      <button class="dbtn" id="dkClear" title="清除筆跡">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 21 6"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/></svg>
      </button>
      <div class="dsep"></div>
      <button class="dbtn" id="dkFull" title="全螢幕">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
    </div>
  </div>

  <script src="svg.js?v=1794213099"></script>
  <script src="ch1.js?v=1794213099"></script>
  <script src="ch2.js?v=1794213099"></script>
  <script src="ch3.js?v=1794213099"></script>
  <script src="ch4.js?v=1794213099"></script>
  <script src="ch5.js?v=1794213099"></script>
  <script src="ch6.js?v=1794213099"></script>
  <script src="engine.js?v=1794213099"></script>
</body>
</html>
